name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the master branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#56d364&color_dots=#e6dfd2,#f1c75b,#e8794f,#c4471f,#17140f
            dist/github-contribution-grid-snake-dark.svg?color_snake=#56d364&color_dots=#161b22,#5c3a1e,#a0522d,#c4471f,#f1c75b

      - name: colocar a cobra na moldura de HQ
        run: |
          node .github/scripts/moldura-cobra.mjs dist/github-contribution-grid-snake.svg claro
          node .github/scripts/moldura-cobra.mjs dist/github-contribution-grid-snake-dark.svg escuro

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
