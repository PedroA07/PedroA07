<text x="22" y="110" class="sans" font-size="14" fill="#f0f6fc">arquitetura e do banco ao app no celular. Fundador da Nexus.</text>
<text x="22" y="136" class="sans" font-size="12.5" fill="#9198a1">Software engineer &amp; full-stack dev. From architecture and</text>
<text x="22" y="152" class="sans" font-size="12.5" fill="#9198a1">databases to mobile.</text>
<text x="22" y="180" font-size="13" fill="#56d364">➜</text><text x="42" y="180" font-size="13" fill="#4493f8">~</text><text x="56" y="180" font-size="13" fill="#6e7681">./boot --skills</text>
<text x="22" y="201" font-size="13" fill="#c9d1d9"><tspan fill="#56d364">[ OK ]</tspan>  Análise e Desenv. de Sistemas — UNIP</text>
<text x="22" y="220" font-size="13" fill="#c9d1d9"><tspan fill="#56d364">[ OK ]</tspan>  Ciência de Dados</text>
<text x="22" y="239" font-size="13" fill="#c9d1d9"><tspan fill="#56d364">[ OK ]</tspan>  Machine Learning</text>
