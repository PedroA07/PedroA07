<defs><pattern id="listras" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="#e3b341"/><rect x="8" width="2" height="10" fill="#b08a2a"/></pattern>
<clipPath id="trilho"><rect x="22" y="277" width="430" height="11"/></clipPath></defs>
<rect x="6" y="20" width="474" height="332" fill="#56d364"/>
<rect x="1.5" y="15.5" width="471" height="329" fill="#0a0d12" stroke="#17140f" stroke-width="3"/>
<text x="22" y="50" font-size="13" fill="#56d364">➜</text><text x="42" y="50" font-size="13" fill="#4493f8">~</text><text x="56" y="50" font-size="13" fill="#6e7681">cat sobre.txt</text>
<text x="22" y="72" class="sans" font-size="14" fill="#f0f6fc">Engenheiro de software e dev full stack. Gosto de pegar um</text>
