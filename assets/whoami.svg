<svg xmlns="http://www.w3.org/2000/svg" width="480" height="352" viewBox="0 0 480 352" role="img" aria-label="Terminal: engenheiro de software e dev full stack, formado em ADS, com Ciência de Dados e Machine Learning concluídos e Cyber Segurança em andamento.">
<title>Terminal: engenheiro de software e dev full stack, formado em ADS, com Ciência de Dados e Machine Learning concluídos e Cyber Segurança em andamento.</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.serif{font-family:Georgia,'Times New Roman',serif}
.gibi{font-family:'Comic Sans MS','Comic Neue',cursive}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

@keyframes pisca{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes progresso{from{transform:translateX(-378.4px)}to{transform:translateX(-129px)}}
.cursor{animation:pisca 1s steps(1) infinite}
.progresso{animation:progresso 6s ease-in-out infinite alternate}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
