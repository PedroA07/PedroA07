<svg xmlns="http://www.w3.org/2000/svg" width="612" height="192" viewBox="0 0 612 192" role="img" aria-label="Press start. Vamos construir algo? Let’s build something.">
<title>Press start. Vamos construir algo? Let’s build something.</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
.serif{font-family:Georgia,'Times New Roman',serif}
.gibi{font-family:'Comic Sans MS','Comic Neue',cursive}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}

@keyframes pisca{0%,49%{opacity:1}50%,100%{opacity:0}}
.pisca{animation:pisca 1.2s steps(1) infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(0 0)">
<rect x="6" y="6" width="894" height="186" fill="#56d364"/>
<rect x="1.5" y="1.5" width="891" height="183" fill="#17140f" stroke="#17140f" stroke-width="3"/>
<text class="pisca" x="30" y="58" font-size="13" font-weight="800" letter-spacing="1.8" fill="#f1c75b">▶ PRESS START PARA CONECTAR</text>
<text class="sans" x="30" y="106" font-size="38" font-weight="900" letter-spacing="-1.2" fill="#f2eee6">Vamos construir algo?</text>
<text class="serif" x="30" y="140" font-size="20" font-style="italic" fill="#cfc8bb">Let’s build something.</text>
</g>
</svg>
