<text x="26" y="210" class="serif" font-size="14.5" fill="#17140f">Decifre, abra uma issue com ela e seu @ entra no hall da fama.</text>
<text x="26" y="230" class="serif" font-size="14.5" fill="#17140f">Três níveis: o 1 está aqui, o 2 no código-fonte do README, o 3</text>
<text x="26" y="250" class="serif" font-size="14.5" fill="#17140f">num commit antigo.</text>
<text class="serif" x="26" y="272" font-size="12" font-style="italic" fill="#17140f">Decode it, open an issue and your @ joins the hall of fame.</text>
