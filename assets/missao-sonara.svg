<svg xmlns="http://www.w3.org/2000/svg" width="480" height="352" viewBox="0 0 480 352" role="img" aria-label="Sonara, missão principal: Player de música desktop que baixa com capa e metadados, organiza a biblioteca e exporta até pro som do carro.">
<title>Sonara, missão principal: Player de música desktop que baixa com capa e metadados, organiza a biblioteca e exporta até pro som do carro.</title>
<style>
